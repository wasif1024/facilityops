syntax = "proto3";

package facilityops.v1;

import "google/protobuf/timestamp.proto";

// Maintenance request intake. Every request runs the deterministic workflow:
// emergency screen, PII redaction, content safety, classification, routing.
service IntakeService {
  // Submit a maintenance request. Retrying with the same request_id returns the
  // original result, but only to the user who submitted it.
  // Requires permission intake:submit.
  rpc SubmitIntake(SubmitIntakeRequest) returns (SubmitIntakeResponse);
  // The caller's own requests, newest first. Requires intake:read_own.
  rpc ListMyRequests(ListMyRequestsRequest) returns (ListMyRequestsResponse);
  // All requests, newest first. Requires intake:read_all.
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
  // One request: your own (intake:read_own) or any (intake:read_all).
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse);
  // The original values behind the [PII_nnnn] placeholders. Every call is audited.
  // Requires pii:reveal_all, or pii:reveal_assigned for a work order assigned to you.
  rpc RevealRequestDetails(RevealRequestDetailsRequest) returns (RevealRequestDetailsResponse);
}

enum RequestSource {
  REQUEST_SOURCE_UNSPECIFIED = 0;
  REQUEST_SOURCE_TEXT = 1;
  REQUEST_SOURCE_PHOTO = 2;
  REQUEST_SOURCE_VOICE = 3;
  // A scanned letter, form or notice. Read with Document Intelligence (first 5 pages).
  REQUEST_SOURCE_DOCUMENT = 4;
}

enum IntakeStatus {
  INTAKE_STATUS_UNSPECIFIED = 0;
  // Emergency signal found; handed to the on-call human without any AI.
  INTAKE_STATUS_EMERGENCY_HANDOFF = 1;
  // Uncertain classification or an unavailable service; queued for a person.
  INTAKE_STATUS_HUMAN_REVIEW = 2;
  // Work order created but waiting for a facility manager's approval.
  INTAKE_STATUS_PENDING_APPROVAL = 3;
  INTAKE_STATUS_WORK_ORDER_CREATED = 4;
  // Closed without a work order by a reviewer, or the work order was rejected.
  INTAKE_STATUS_DISMISSED = 5;
}

enum MaintenanceCategory {
  MAINTENANCE_CATEGORY_UNSPECIFIED = 0;
  MAINTENANCE_CATEGORY_HVAC = 1;
  MAINTENANCE_CATEGORY_PLUMBING = 2;
  MAINTENANCE_CATEGORY_ELECTRICAL = 3;
  MAINTENANCE_CATEGORY_SECURITY = 4;
  MAINTENANCE_CATEGORY_STRUCTURAL = 5;
  MAINTENANCE_CATEGORY_CLEANING = 6;
  MAINTENANCE_CATEGORY_OTHER = 7;
}

message SubmitIntakeRequest {
  // Client-generated UUID used for idempotent retries. Generated by the server if empty.
  string request_id = 1;
  RequestSource source = 2;
  // The request in the tenant's own words, up to 10,000 characters. Required for text
  // requests; an optional caption for photo, voice and document requests.
  string text = 3;
  // Photo (JPEG, PNG, WebP...), voice note (WAV, MP3, OGG, WebM...) or scanned document
  // (PDF, TIFF, JPEG, PNG), up to 8 MiB. The bytes must match media_type. Images are
  // checked by Content Safety; text is extracted, then the file is discarded: raw media
  // is never stored. A file that fails a check goes to human review with a reason code.
  bytes media = 4;
  // MIME type of media, for example "image/jpeg", "audio/webm" or "application/pdf".
  string media_type = 5;
  // Optional ISO 639-1 language hint: "en", "es" or "fr".
  string language = 6;
}

message SubmitIntakeResponse {
  IntakeResult result = 1;
}

message IntakeResult {
  string request_id = 1;
  IntakeStatus status = 2;
  // Stable machine-readable reason, for example "emergency_gas" or "classification_uncertain".
  string reason_code = 3;
  MaintenanceCategory category = 4;
  // 1 (lowest) to 5 (highest). Absent when the request was not classified.
  optional int32 priority = 5;
  optional double confidence = 6;
  // Set when a work order was created.
  string work_order_id = 7;
}

message IntakeRequestSummary {
  string request_id = 1;
  RequestSource source = 2;
  IntakeStatus status = 3;
  string reason_code = 4;
  MaintenanceCategory category = 5;
  optional int32 priority = 6;
  optional double confidence = 7;
  string work_order_id = 8;
  // Work order status name, for example "open" or "completed"; empty when there is none.
  string work_order_status = 9;
  // PII-redacted text, with [PII_nnnn] placeholders.
  string redacted_description = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListMyRequestsRequest {
  // 1 to 100; defaults to 20.
  int32 limit = 1;
  int32 offset = 2;
}

message ListMyRequestsResponse {
  repeated IntakeRequestSummary requests = 1;
  int32 total = 2;
}

message ListRequestsRequest {
  IntakeStatus status = 1;
  // 1 to 100; defaults to 20.
  int32 limit = 2;
  int32 offset = 3;
}

message ListRequestsResponse {
  repeated IntakeRequestSummary requests = 1;
  int32 total = 2;
}

message GetRequestRequest {
  string request_id = 1;
}

message GetRequestResponse {
  IntakeRequestSummary request = 1;
}

message RevealRequestDetailsRequest {
  string request_id = 1;
}

message RevealRequestDetailsResponse {
  string request_id = 1;
  string redacted_description = 2;
  // Placeholder (for example "[PII_0001]") to original value. Do not cache or log.
  map<string, string> values = 3;
}
