syntax = "proto3";

package facilityops.v1;

// The signed-in user's own account.
service AccountService {
  // Return the caller's identity, roles and permissions. The first call after
  // sign-in creates the user with the default role. Requires authentication only.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message GetMeRequest {}

message GetMeResponse {
  string user_id = 1;
  string display_name = 2;
  repeated string roles = 3;
  // Permission ids such as "intake:submit"; use these to decide what the UI shows.
  repeated string permissions = 4;
}
